<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>El juego de IT — AMO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#0F1424; --bg2:#161D33; --card:#1C2438; --line:#2A3350;
    --ink:#F0F2FA; --ink-soft:#9AA3C0;
    --accent:#4FD1C5; --accent2:#F0A050;
    --ok:#3ECF8E; --bad:#FF5C7A; --warn:#F0C050;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;
    background:radial-gradient(circle at 20% 0%, var(--bg2), var(--bg1) 60%);
    color:var(--ink);font-family:'Inter',sans-serif;line-height:1.55;
  }
  h1,h2,h3{font-family:'Poppins',sans-serif;margin:0;}
  .wrap{max-width:720px;margin:0 auto;padding:26px 18px 60px;}
  img{image-rendering:pixelated;}

  header{text-align:center;margin-bottom:22px;}
  .role-tag{display:inline-block;background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0F1424;font-family:'Poppins',sans-serif;font-weight:700;font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:5px 14px;border-radius:14px;margin-bottom:10px;}
  h1{font-size:22px;font-weight:800;}
  .subtitle{font-size:13px;color:var(--ink-soft);margin-top:4px;}

  /* Stat gauges */
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:22px 0 26px;}
  .stat-box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;position:relative;overflow:hidden;}
  .stat-name{font-size:11px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
  .stat-value{font-family:'Poppins',sans-serif;font-weight:800;font-size:19px;}
  .stat-bar-track{height:7px;background:#0F1424;border-radius:6px;margin-top:8px;overflow:hidden;}
  .stat-bar-fill{height:100%;border-radius:6px;transition:width .7s cubic-bezier(.22,1,.36,1), background-color .4s;}
  .stat-float{position:absolute;top:8px;right:10px;font-family:'Poppins',sans-serif;font-weight:800;font-size:13px;opacity:0;transition:opacity .3s, transform .3s;transform:translateY(6px);}
  .stat-float.show{opacity:1;transform:translateY(0);}
  .stat-float.pos{color:var(--ok);}
  .stat-float.neg{color:var(--bad);}

  #weekProgress{display:flex;justify-content:center;gap:5px;margin-bottom:18px;flex-wrap:wrap;}
  .week-dot{width:9px;height:9px;border-radius:50%;background:var(--line);}
  .week-dot.done{background:var(--accent);}
  .week-dot.current{background:var(--accent2);box-shadow:0 0 0 3px rgba(240,160,80,.25);}

  /* =============== START SCREEN =============== */
  #startScreen{text-align:center;padding-top:10px;}
  #startScreen .title-art{width:100%;max-width:500px;border-radius:16px;display:block;margin:0 auto 6px;box-shadow:0 14px 40px rgba(0,0,0,.5);}
  #startScreen .amo-badge{display:flex;align-items:center;justify-content:center;gap:8px;margin:14px 0 6px;}
  #startScreen .amo-badge img{height:34px;width:auto;border-radius:8px;background:#fff;padding:3px;}
  #startScreen .amo-badge span{font-family:'Poppins',sans-serif;font-size:12px;color:var(--ink-soft);letter-spacing:.05em;}
  #startScreen .subtitle-it{font-family:'Poppins',sans-serif;font-weight:800;font-size:26px;letter-spacing:.06em;color:var(--accent2);margin:2px 0 22px;}
  .start-btn{
    background:linear-gradient(90deg,var(--accent),var(--accent2));color:#0F1424;
    font-family:'Poppins',sans-serif;font-weight:800;font-size:16px;letter-spacing:.03em;
    border:none;padding:15px 44px;border-radius:30px;cursor:pointer;
    box-shadow:0 8px 24px rgba(79,209,197,.35);
  }
  .start-btn:hover{filter:brightness(1.08);}

  /* =============== VISUAL NOVEL SCENE =============== */
  #vnScreen{display:none;}
  .vn-stage{
    position:relative;width:100%;aspect-ratio:1/1;max-height:420px;
    border-radius:18px;overflow:hidden;background:#fff;box-shadow:0 14px 36px rgba(0,0,0,.45);
    margin-bottom:0;
  }
  .vn-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .3s;}
  .vn-char{position:absolute;bottom:0;height:78%;right:6%;transition:opacity .25s, transform .25s;}
  .vn-char.left{left:6%;right:auto;}
  .vn-prop{position:absolute;width:16%;transition:opacity .3s;}

  .vn-box{
    background:var(--card);border:1px solid var(--line);border-radius:0 0 18px 18px;
    margin-top:-6px;padding:18px 20px 16px;box-shadow:0 14px 36px rgba(0,0,0,.45);
  }
  .vn-speaker{font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;color:var(--accent2);margin-bottom:6px;letter-spacing:.03em;}
  .vn-text{font-size:14.5px;color:var(--ink);min-height:44px;}
  .vn-continue{
    display:block;margin:14px auto 0;background:transparent;border:1.5px solid var(--accent);
    color:var(--accent);font-family:'Poppins',sans-serif;font-weight:700;font-size:13px;
    padding:9px 22px;border-radius:20px;cursor:pointer;
  }
  .vn-tap-hint{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:6px;opacity:.7;}

  /* =============== GAME AREA (decision cards) =============== */
  #gameArea{display:none;}
  .scenario-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 22px;box-shadow:0 10px 30px rgba(0,0,0,.35);}
  .week-label{font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;}
  .week-title{font-size:19px;font-weight:700;margin-bottom:10px;}
  .story-text{font-size:14.5px;color:var(--ink-soft);margin-bottom:20px;}

  .options{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{
    text-align:left;background:#151B2E;border:1.5px solid var(--line);color:var(--ink);
    font-family:'Inter',sans-serif;font-size:14px;font-weight:500;
    padding:14px 16px;border-radius:12px;cursor:pointer;transition:border-color .15s, background .15s, transform .1s;
  }
  .opt-btn:hover:not(:disabled){border-color:var(--accent);background:#182036;transform:translateY(-1px);}
  .opt-btn:disabled{cursor:default;opacity:.55;}
  .opt-btn.chosen{border-color:var(--accent2);background:#241C14;opacity:1;}
  .opt-letter{display:inline-flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--line);color:var(--ink);font-family:'Poppins',sans-serif;font-size:11px;font-weight:700;margin-right:10px;}
  .opt-btn.chosen .opt-letter{background:var(--accent2);color:#0F1424;}

  .consequence-box{
    display:none;margin-top:18px;background:#131A2C;border-left:4px solid var(--accent2);
    border-radius:10px;padding:14px 16px;font-size:13.5px;color:var(--ink);
  }
  .consequence-box .deltas{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px;}
  .delta-chip{font-family:'Poppins',sans-serif;font-size:11.5px;font-weight:700;padding:3px 10px;border-radius:10px;}
  .delta-chip.pos{background:rgba(62,207,142,.15);color:var(--ok);}
  .delta-chip.neg{background:rgba(255,92,122,.15);color:var(--bad);}

  .next-btn{
    display:none;margin:20px auto 0;background:linear-gradient(90deg,var(--accent),var(--accent2));
    color:#0F1424;font-family:'Poppins',sans-serif;font-weight:700;font-size:14px;
    border:none;padding:12px 28px;border-radius:24px;cursor:pointer;
  }

  #finalScreen{display:none;text-align:center;}
  #finalScreen .final-icon{font-size:56px;margin-bottom:6px;}
  #finalScreen h2{font-size:24px;margin-bottom:8px;}
  #finalScreen p.final-msg{font-size:14.5px;color:var(--ink-soft);max-width:480px;margin:0 auto 22px;}
  .final-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-bottom:26px;}
  .replay-btn{
    background:transparent;border:1.5px solid var(--accent);color:var(--accent);
    font-family:'Poppins',sans-serif;font-weight:700;font-size:13.5px;
    padding:11px 24px;border-radius:22px;cursor:pointer;
  }
  footer.page-footer{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:34px;opacity:.7;}
</style>
</head>
<body>
<div class="wrap">

  <!-- ============ PANTALLA DE INICIO ============ -->
  <div id="startScreen">
    <img class="title-art" id="titleArt" alt="El juego">
    <div class="subtitle-it">DE IT</div>
    <div class="amo-badge"><img id="amoLogo" alt="AMO"><span>AMO · la escuela de español</span></div>
    <button class="start-btn" onclick="startGame()">▶ EMPEZAR</button>
  </div>

  <!-- ============ ESCENA DE NOVELA VISUAL ============ -->
  <div id="vnScreen">
    <div class="vn-stage" id="vnStage">
      <img class="vn-bg" id="vnBg" alt="">
      <img class="vn-char" id="vnChar" alt="" style="display:none;">
    </div>
    <div class="vn-box">
      <div class="vn-speaker" id="vnSpeaker" style="display:none;"></div>
      <div class="vn-text" id="vnText"></div>
      <button class="vn-continue" id="vnContinueBtn" onclick="vnAdvance()">Continuar →</button>
      <div class="vn-tap-hint">Pulsa «Continuar» para seguir la historia</div>
    </div>
  </div>

  <!-- ============ SHELL DEL JUEGO (stats + semanas) ============ -->
  <header id="gameHeader" style="display:none;">
    <span class="role-tag">Periodo de prueba · 13 semanas</span>
    <h1>Director en prueba</h1>
    <div class="subtitle">Cada decisión tiene consecuencias. No sabrás cuáles hasta elegir.</div>
  </header>

  <div class="stats" id="statsWrap" style="display:none;"></div>
  <div id="weekProgress"></div>

  <div id="gameArea">
    <div class="scenario-card">
      <div class="week-label" id="weekLabel">Semana 1 / 13</div>
      <div class="week-title" id="weekTitle"></div>
      <div class="story-text" id="weekStory"></div>
      <div class="options" id="weekOptions"></div>
      <div class="consequence-box" id="consequenceBox"></div>
      <button class="next-btn" id="nextBtn" onclick="nextWeek()">Siguiente semana →</button>
    </div>
  </div>

  <div id="finalScreen">
    <div class="final-icon" id="finalIcon"></div>
    <h2 id="finalTitle"></h2>
    <p class="final-msg" id="finalMsg"></p>
    <div class="final-stats" id="finalStats"></div>
    <button class="replay-btn" onclick="restartGame()">🔄 Jugar de nuevo</button>
  </div>

  <footer class="page-footer">AMO · Simulación de gestión — prototipo interactivo</footer>
</div>

      { text:'Implementar la tecnología parcialmente.', consequence:'Mejora los productos gradualmente y con menos riesgo, aunque no aprovecha todo el potencial.', deltas:{capital:1, fama:1} },

  { title:'Auditoría Interna', story:'La empresa está programada para una auditoría interna. Debes asegurarte de que todos los procesos y documentación estén en orden para evitar problemas legales o financieros.',
    options:[
      { text:'Realizar una auditoría previa interna.', consequence:'Asegura que todo esté en orden, pero puede verse como una falta de confianza en el personal.', deltas:{capital:1, lealtad:-1} },

  { title:'Evaluación del Periodo de Prueba', story:'Es el final de tu periodo de prueba y el consejo directivo evaluará tu desempeño. Debes preparar un informe detallado y demostrar cómo tus decisiones han impactado positivamente a la empresa.',
    options:[
      { text:'Preparar un informe detallado con métricas de desempeño.', consequence:'Impresiona al consejo directivo.', deltas:{fama:1} },
      { text:'Organizar una presentación interactiva con el equipo.', consequence:'Muestra el trabajo en equipo y mejora la moral, pero tiene un costo.', deltas:{lealtad:1, fama:1, capital:-1} },
      { text:'Solicitar feedback de los empleados y clientes.', consequence:'Mejora la relación con empleados y clientes, y muestra buenas habilidades comunicativas.', deltas:{lealtad:1, clientes:1, personal:1} },
      { text:'No hacer nada especial.', consequence:'No destacas y es menos probable que impresiones al consejo directivo.', deltas:{fama:-2} },

/* ============================================================
   GUION DE NOVELA VISUAL — semanas 1 a 4
   Cada paso: {bg, char, speaker, text} para diálogo,
   o {decision:N} para lanzar la tarjeta de decisión de la semana N (0-indexed),
   o {result:N} para mostrar la consecuencia de la semana N sobre un fondo.
   ============================================================ */
const SCRIPT = [
  // ---------- Instrucciones (sobre fondo de casa) ----------
  {bg:'bedroom', text:'Eres un nuevo director de una empresa de IT y tienes un periodo de prueba de 13 semanas. Cada semana, se presentará una situación o problema en uno de los departamentos de la empresa. Deberás tomar decisiones en forma de comandos en imperativo, y cada decisión tendrá consecuencias en cinco características: lealtad, capital, personal, fama de la empresa y clientes. Empezarás con 5 puntos en cada característica, y tu objetivo es mantener un equilibrio positivo en estas áreas.'},
  {bg:'bedroom', text:'¡Buenos días! Hoy es tu primer día de trabajo. ¡Felicidades! Vamos a ver qué tienes que hacer para ganar ese puesto de trabajo.'},
  {bg:'bedroom', text:'Objetivo: cada semana puedes tomar solamente 1 decisión. Después vienen las consecuencias — puedes ganar o perder algunos puntos. Si al final de las 13 semanas tienes al menos dos características con 8 o más puntos y ninguna característica con 3 o menos puntos, recibirás una promoción. Si tienes una característica con 8 o más puntos y ninguna con 3 o menos, te quedarás en tu puesto. Si ninguna característica tiene 8 o más puntos y ninguna tiene 3 o menos, necesitarás mejorar tus habilidades. Si alguna característica tiene 3 o menos puntos, perderás tu puesto.'},
  {bg:'bedroom', text:'Suerte en tu trabajo.'},

  // ---------- Semana 1: llegada a la oficina, Juan ----------
  {bg:'office', char:'juan', speaker:'Juan', text:'¡Buenos días, señor director!'},
  {bg:'office', char:'juan', speaker:'Juan', text:'Me llamo Juan, soy su asistente de trabajo. Estaré aquí para responder a todas sus preguntas.'},
  {bg:'office', char:'juan', speaker:'Juan', text:'Al resumir, lo primero que le aconsejo arreglar es el problema en el Departamento de Desarrollo.'},
  {decision:0},
  {result:0},

  // ---------- Semana 2: carta del dueño, traída por Juan ----------
  {bg:'office', char:'juan', speaker:'Juan', text:'Señor director, ha llegado una carta del dueño de la empresa.', prop:'envClosed'},
  {bg:'office', char:'juan', speaker:'Juan', text:'“....Yo he recibido varios correos electrónicos de clientes quejándose de la calidad del soporte técnico. Esto podría afectar la reputación de la empresa si no se maneja adecuadamente....” — Dueño de empresa', prop:'envOpen'},
  {decision:1},
  {result:1},

  // ---------- Semana 3: SMS en la parada del autobús ----------
  {bg:'busstop', text:'De camino a la oficina, tu teléfono suena — ha llegado un mensaje.', prop:'phoneSms'},
  {bg:'busstop', text:'¡Buenos días! El Departamento de Ventas está descontento debido a la falta de comisiones atractivas. Los vendedores consideran buscar empleo en otras empresas.', prop:'phoneSms'},
  {decision:2},
  {result:2},

  // ---------- Semana 4: Marco Gómez ----------
  {bg:'office', char:'juan', speaker:'Juan', text:'Quiero presentarle al señor Gómez, el representante de una empresa internacional.'},
  {bg:'office', speaker:'Marco Gómez', text:'¡Buenos días, señor! Me llamo Marco Gómez.', prop:'coffee'},
  {bg:'office', speaker:'Marco Gómez', text:'Quiero ofrecerle una buena oportunidad de cooperación para entrar en el mercado mundial.', prop:'coffee'},
  {bg:'office', speaker:'Marco Gómez', text:'Le he traído un café. Con eso podemos empezar la discusión en el vestíbulo. Si le interesa, le espero abajo.', prop:'coffee'},
  {bg:'office', speaker:'Marco Gómez', text:'Espero su respuesta. Hasta muy pronto.', prop:'coffee'},
  {bg:'office', char:'juan', speaker:'Juan', text:'¿Qué le respondo, señor?'},
  {decision:3},
  {result:3},

  {bg:'office', char:'juan', speaker:'Juan', text:'Muy bien, señor director. Seguimos con la semana siguiente...'},
];

/* ============================================================
   ESTADO DEL JUEGO
   ============================================================ */
const START_VALUE = 5;
const MIN_VALUE = 0, MAX_VALUE = 10;
let stats = {};
let currentWeek = 0;
let chosenThisWeek = false;
let scriptIndex = 0;
let simpleModeStarted = false; // true una vez que el guion narrado termina y usamos la tarjeta simple

function initStats(){
  stats = {};
  STAT_KEYS.forEach(k => stats[k] = START_VALUE);
}

function renderStatsShell(){
  const wrap = document.getElementById('statsWrap');
  wrap.innerHTML = STAT_KEYS.map(k => `
    <div class="stat-box" id="statBox-${k}">
      <div class="stat-name"><span>${STAT_ICONS[k]} ${STAT_LABELS[k]}</span></div>
      <div class="stat-value" id="statValue-${k}">${stats[k]}</div>
      <div class="stat-bar-track"><div class="stat-bar-fill" id="statBar-${k}" style="width:${stats[k]*10}%;"></div></div>
      <div class="stat-float" id="statFloat-${k}"></div>
    </div>
  `).join('');
  STAT_KEYS.forEach(updateBarColor);
}
function updateBarColor(k){
  const bar = document.getElementById('statBar-'+k);
  if(!bar) return;
  const v = stats[k];
  let color = '#4FD1C5';
  if(v < 4) color = 'var(--bad)';
  else if(v >= 8) color = 'var(--ok)';
  else color = 'var(--warn)';
  bar.style.background = color;
}
function applyDeltas(deltas){
  STAT_KEYS.forEach(k=>{
    const d = deltas[k] || 0;
    if(d === 0) return;
    stats[k] = Math.max(MIN_VALUE, Math.min(MAX_VALUE, stats[k] + d));
    const valueEl = document.getElementById('statValue-'+k);
    const barEl = document.getElementById('statBar-'+k);
    const floatEl = document.getElementById('statFloat-'+k);
    if(valueEl) valueEl.textContent = stats[k];
    if(barEl) barEl.style.width = (stats[k]*10) + '%';
    updateBarColor(k);
    if(floatEl){
      floatEl.textContent = (d > 0 ? '+' : '') + d;
      floatEl.className = 'stat-float show ' + (d > 0 ? 'pos' : 'neg');
      setTimeout(()=> floatEl.classList.remove('show'), 1600);
    }
  });
}
function renderWeekProgress(){
  const el = document.getElementById('weekProgress');
  el.innerHTML = WEEKS.map((_, i)=>{
    let cls = 'week-dot';
    if(i < currentWeek) cls += ' done';
    else if(i === currentWeek) cls += ' current';
    return `<span class="${cls}"></span>`;
  }).join('');
}

/* ---------- pantalla de inicio ---------- */
function initStartScreen(){
  document.getElementById('titleArt').src = ASSETS.titleScene;
  document.getElementById('amoLogo').src = ASSETS.titleLine; // se sustituirá por el logo real de AMO si se aporta aparte
}
function startGame(){
  document.getElementById('startScreen').style.display = 'none';
  document.getElementById('vnScreen').style.display = 'block';
  initStats();
  scriptIndex = 0;
  playScriptStep();
}

/* ---------- motor de novela visual ---------- */
function playScriptStep(){
  if(scriptIndex >= SCRIPT.length){
    // guion narrado terminado -> pasar a modo tarjeta simple para semanas restantes
    enterSimpleMode();
    return;
  }
  const step = SCRIPT[scriptIndex];

  if(step.decision !== undefined){
    document.getElementById('vnScreen').style.display = 'none';
    showDecisionInline(step.decision, true);
    return;
  }
  if(step.result !== undefined){
    showResultScene(step.result);
    return;
  }

  document.getElementById('vnScreen').style.display = 'block';
  document.getElementById('gameArea').style.display = 'none';
  const bg = document.getElementById('vnBg');
  bg.src = ASSETS[step.bg] || ASSETS.office;

  const charEl = document.getElementById('vnChar');
  if(step.char){
    charEl.src = ASSETS[step.char];
    charEl.style.display = 'block';
  } else {
    charEl.style.display = 'none';
  }

  // props (sobre/telefono/cafe) como icono flotante en la esquina
  const stage = document.getElementById('vnStage');
  let propEl = document.getElementById('vnPropIcon');
  if(propEl) propEl.remove();
  if(step.prop){
    propEl = document.createElement('img');
    propEl.id = 'vnPropIcon';
    propEl.className = 'vn-prop';
    propEl.style.top = '6%';
    propEl.style.left = '6%';
    propEl.src = ASSETS[step.prop];
    stage.appendChild(propEl);
  }

  const speakerEl = document.getElementById('vnSpeaker');
  if(step.speaker){
    speakerEl.textContent = step.speaker;
    speakerEl.style.display = 'block';
  } else {
    speakerEl.style.display = 'none';
  }
  document.getElementById('vnText').textContent = step.text;
  document.getElementById('vnContinueBtn').style.display = 'block';
}
function vnAdvance(){
  scriptIndex++;
  playScriptStep();
}

/* ---------- decision dentro del guion narrado ---------- */
function showDecisionInline(weekIdx, fromScript){
  currentWeek = weekIdx;
  document.getElementById('gameHeader').style.display = 'block';
  document.getElementById('statsWrap').style.display = 'grid';
  document.getElementById('gameArea').style.display = 'block';
  renderWeek(fromScript);
}

function showResultScene(weekIdx){
  const w = WEEKS[weekIdx];
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('vnScreen').style.display = 'block';
  const bg = document.getElementById('vnBg');
  bg.src = ASSETS[w.resultBg] || ASSETS.livingroom;
  document.getElementById('vnChar').style.display = 'none';
  let propEl = document.getElementById('vnPropIcon');
  if(propEl) propEl.remove();
  document.getElementById('vnSpeaker').style.display = 'none';

  const chosen = lastChoice[weekIdx];
  const opt = w.options[chosen];
  const deltaText = STAT_KEYS.filter(k=>opt.deltas[k]).map(k=>{
    const d = opt.deltas[k];
    return STAT_ICONS[k]+' '+STAT_LABELS[k]+' '+(d>0?'+':'')+d;
  }).join('  ·  ');

  document.getElementById('vnText').textContent = (w.resultIntro ? w.resultIntro + ' ' : '') + opt.consequence + (deltaText ? ('  (' + deltaText + ')') : '');
  document.getElementById('vnContinueBtn').style.display = 'block';
}

/* ---------- modo simple (semanas sin guion narrado propio) ---------- */
function enterSimpleMode(){
  simpleModeStarted = true;
  document.getElementById('vnScreen').style.display = 'none';
  document.getElementById('gameHeader').style.display = 'block';
  document.getElementById('statsWrap').style.display = 'grid';
  document.getElementById('gameArea').style.display = 'block';
  renderWeek(false);
  window.scrollTo({top:0, behavior:'smooth'});
}

/* ---------- tarjeta de decisión (semana) ---------- */
let lastChoice = {};
function renderWeek(){
  chosenThisWeek = false;
  const w = WEEKS[currentWeek];
  document.getElementById('weekLabel').textContent = 'Semana ' + (currentWeek+1) + ' / ' + WEEKS.length;
  document.getElementById('weekTitle').textContent = w.title;
  document.getElementById('weekStory').textContent = w.story;
  const optsWrap = document.getElementById('weekOptions');
  optsWrap.innerHTML = w.options.map((opt, i)=>`
    <button class="opt-btn" id="opt-${i}" onclick="chooseOption(${i})">
      <span class="opt-letter">${String.fromCharCode(65+i)}</span>${opt.text}
    </button>
  `).join('');
  document.getElementById('consequenceBox').style.display = 'none';
  document.getElementById('nextBtn').style.display = 'none';
  renderWeekProgress();
  window.scrollTo({top:0, behavior:'smooth'});
}

function chooseOption(i){
  if(chosenThisWeek) return;
  chosenThisWeek = true;
  lastChoice[currentWeek] = i;
  const w = WEEKS[currentWeek];
  const opt = w.options[i];

  document.querySelectorAll('.opt-btn').forEach((btn, idx)=>{
    btn.disabled = true;
    if(idx === i) btn.classList.add('chosen');
  });

  const hasScriptedResult = SCRIPT.some(s => s.decision === currentWeek) && WEEKS[currentWeek].resultBg;

  applyDeltas(opt.deltas);

  if(hasScriptedResult){
    // el resultado se mostrará como escena narrada al pulsar "siguiente" -> volvemos al guion
    const nextBtn = document.getElementById('nextBtn');
    const box = document.getElementById('consequenceBox');
    const deltaChips = STAT_KEYS.filter(k => opt.deltas[k]).map(k=>{
      const d = opt.deltas[k];
      return `<span class="delta-chip ${d>0?'pos':'neg'}">${STAT_ICONS[k]} ${STAT_LABELS[k]} ${d>0?'+':''}${d}</span>`;
    }).join('');
    box.innerHTML = `<div>${opt.consequence}</div><div class="deltas">${deltaChips}</div>`;
    box.style.display = 'block';
    nextBtn.textContent = 'Continuar →';
    nextBtn.onclick = function(){
      document.getElementById('gameArea').style.display = 'none';
      scriptIndex++; // saltar el paso {decision:N}
      playScriptStep(); // esto ejecutará {result:N}
    };
    nextBtn.style.display = 'block';
    return;
  }

  const deltaChips = STAT_KEYS.filter(k => opt.deltas[k]).map(k=>{
    const d = opt.deltas[k];
    return `<span class="delta-chip ${d>0?'pos':'neg'}">${STAT_ICONS[k]} ${STAT_LABELS[k]} ${d>0?'+':''}${d}</span>`;
  }).join('');
  const box = document.getElementById('consequenceBox');
  box.innerHTML = `<div>${opt.consequence}</div><div class="deltas">${deltaChips}</div>`;
  box.style.display = 'block';

  const nextBtn = document.getElementById('nextBtn');
  nextBtn.textContent = currentWeek < WEEKS.length - 1 ? 'Siguiente semana →' : 'Ver evaluación final →';
  nextBtn.onclick = nextWeek;
  nextBtn.style.display = 'block';
}

function nextWeek(){
  currentWeek++;
  if(currentWeek >= WEEKS.length){
    showFinalScreen();
    return;
  }
  // si la siguiente semana tiene guion narrado pendiente (resultado ya mostrado antes), seguir el guion narrado
  const scriptHasNext = SCRIPT.some(s => s.decision === currentWeek);
  if(scriptHasNext && !simpleModeStarted){
    document.getElementById('gameArea').style.display = 'none';
    document.getElementById('vnScreen').style.display = 'block';
    playScriptStep();
    return;
  }
  renderWeek();
}

function evaluateOutcome(){
  const values = STAT_KEYS.map(k => stats[k]);
  const anyBelow4 = values.some(v => v < 4);
  const countAbove8 = values.filter(v => v >= 8).length;

  if(anyBelow4){
    return {type:'lose', icon:'❌', title:'No has superado el periodo de prueba',
      msg:'Al menos un área de la empresa ha quedado por debajo del nivel aceptable. El consejo directivo decide no confirmarte en el puesto. Gracias por tu esfuerzo — inténtalo de nuevo.'};
  }
  if(countAbove8 >= 2){
    return {type:'promotion', icon:'🏆', title:'¡Ascenso! Director General',
      msg:'Tu gestión ha sido excepcional en varias áreas a la vez. El consejo directivo no solo te confirma en el puesto — te ofrece un ascenso.'};
  }
  if(countAbove8 >= 1){
    return {type:'win', icon:'✅', title:'¡Has superado el periodo de prueba!',
      msg:'Tu gestión ha sido sólida y al menos un área de la empresa destaca claramente. Te confirman en el puesto de Director.'};
  }
  return {type:'study', icon:'📘', title:'Necesitas más formación',
    msg:'Ninguna área de la empresa está en crisis, pero tampoco destacas en nada en particular. El consejo considera que aún te falta experiencia y te ofrece repetir el periodo de prueba.'};
}

function showFinalScreen(){
  document.getElementById('vnScreen').style.display = 'none';
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('weekProgress').style.display = 'none';
  const outcome = evaluateOutcome();

  document.getElementById('finalIcon').textContent = outcome.icon;
  document.getElementById('finalTitle').textContent = outcome.title;
  document.getElementById('finalMsg').textContent = outcome.msg;

  const finalStats = document.getElementById('finalStats');
  finalStats.innerHTML = STAT_KEYS.map(k=>{
    const v = stats[k];
    let color = v < 4 ? 'var(--bad)' : v >= 8 ? 'var(--ok)' : 'var(--warn)';
    return `<div class="stat-box"><div class="stat-name">${STAT_ICONS[k]} ${STAT_LABELS[k]}</div><div class="stat-value" style="color:${color};">${v}/10</div></div>`;
  }).join('');

  document.getElementById('finalScreen').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

function restartGame(){
  currentWeek = 0;
  scriptIndex = 0;
  simpleModeStarted = false;
  lastChoice = {};
  initStats();
  document.getElementById('finalScreen').style.display = 'none';
  document.getElementById('gameArea').style.display = 'none';
  document.getElementById('gameHeader').style.display = 'none';
  document.getElementById('statsWrap').style.display = 'none';
  document.getElementById('weekProgress').style.display = 'flex';
  document.getElementById('startScreen').style.display = 'block';
  window.scrollTo({top:0, behavior:'smooth'});
}

/* init */
initStartScreen();
renderStatsShell();
</script>

<!DOCTYPE html>
<html lang="es"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Práctica individual — AMO, la escuela de español</title>
<link id="favicon" rel="icon" href="data:,">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#3A8C8C;--teal-d:#2C7272;--teal-l:#E4F2F2;--teal-xl:#F1F8F8;--orange:#F0A050;--orange-d:#DB8736;--orange-l:#FDF0E0;--slate:#475771;--ink:#24324A;--ink-soft:#5E6C82;--muted:#8895A7;--bg:#F3F8FA;--card:#fff;--soft:#F7FAFB;--line:#E2E9EF;--line-2:#CBD6E0;--ok:#2E9E5B;--ok-l:#E6F6EC;--bad:#D9534F;--bad-l:#FCEAE9;--shadow:0 12px 36px rgba(36,50,74,.09);--shadow-s:0 3px 12px rgba(36,50,74,.07);--banner:linear-gradient(135deg,#fff 0%,#E8F4F4 55%,#FDEFDD 100%)}
:root[data-theme=dark]{--ink:#EAF0F6;--ink-soft:#A9B6C6;--muted:#7F8DA1;--slate:#DCE6F0;--bg:#0F1621;--card:#18222F;--soft:#1D2A3A;--line:#2A3A4E;--line-2:#3A4E66;--teal-l:#1B3B40;--teal-xl:#173034;--orange-l:#3A2D1C;--ok-l:#163424;--bad-l:#3A1E1E;--shadow:0 12px 36px rgba(0,0,0,.45);--shadow-s:0 3px 12px rgba(0,0,0,.35);--banner:linear-gradient(135deg,#1E2C3C 0%,#1B3438 55%,#35291B 100%)}
*{box-sizing:border-box}
body{margin:0;font-family:'Inter',system-ui,sans-serif;color:var(--ink);line-height:1.5;min-height:100vh;background:radial-gradient(900px 520px at 6% -6%,rgba(58,140,140,.17),transparent 60%),radial-gradient(800px 520px at 104% 0,rgba(240,160,80,.17),transparent 58%),var(--bg);background-attachment:fixed}
h1,h2,h3,h4{font-family:'Montserrat',sans-serif;line-height:1.2;margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
.wrap{max-width:820px;margin:0 auto;padding:0 14px}
.topbar{position:fixed;top:0;left:0;right:0;height:4px;background:rgba(127,141,161,.18);z-index:60}
.bar-fill{height:100%;width:0;background:linear-gradient(90deg,var(--teal),var(--orange));transition:width .7s;border-radius:0 4px 4px 0}
.hdr{padding-top:14px}
.hdr-in{background:var(--banner);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:14px 20px;display:flex;align-items:center;gap:14px}
.hdr img{height:50px}
.hdr .t small{font:800 11px 'Montserrat';letter-spacing:.14em;text-transform:uppercase;color:var(--orange-d)}
.hdr h1{font-size:clamp(19px,4.6vw,26px);color:var(--slate);font-weight:800}
.hb{margin-left:auto;width:42px;height:42px;border-radius:13px;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow-s);font-size:17px}
.hb:hover{border-color:var(--orange)}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:20px 22px;margin-top:16px;animation:up .6s both}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.hello{padding-top:26px;padding-bottom:26px;display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;position:relative;overflow:hidden}
.hello::before{content:'';position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:radial-gradient(circle,rgba(240,160,80,.25),transparent 70%)}
.eb{font:800 11px 'Montserrat';letter-spacing:.14em;text-transform:uppercase;color:var(--orange-d)}
.hello h2{font-size:clamp(24px,6vw,34px);color:var(--slate);margin:4px 0 8px}
.hello h2 em{font-style:normal;color:var(--teal)}
.todo{background:var(--teal-xl);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:14px;padding:10px 14px;font-size:14.5px;position:relative}
.todo b{font-family:'Montserrat'}
.todo span{display:block;color:var(--ink-soft);font-size:13px;font-style:italic;margin-top:2px}
.ringw{display:flex;flex-direction:column;align-items:center;gap:6px}.curt{font:800 11.5px 'Montserrat';color:var(--orange-d);background:var(--orange-l);border-radius:99px;padding:3px 12px;white-space:nowrap}
.ring{position:relative;width:118px;height:118px}
.ring svg{transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:11;stroke-linecap:round}
.ring .bg{stroke:var(--line)}.ring .fg{stroke:url(#g);transition:stroke-dashoffset .9s cubic-bezier(.3,.8,.3,1)}
.ring div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font:800 26px 'Montserrat';color:var(--slate)}
.ring div small{font:700 10px 'Montserrat';color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.card h3{font-size:16px;color:var(--slate);display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card h3 i{font-style:normal;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;display:flex;align-items:center;justify-content:center;font-size:14px;box-shadow:0 4px 10px rgba(240,160,80,.4)}
.words{display:flex;flex-wrap:wrap;gap:8px}
.w{border:2px solid var(--teal);background:var(--card);border-radius:14px;padding:5px 12px;font-weight:700;color:var(--teal-d);font-size:14.5px;line-height:1.25;transition:.15s;box-shadow:var(--shadow-s)}
:root[data-theme=dark] .w{color:#7FD0D0}
.w small{display:block;font-weight:500;font-size:11.5px;color:var(--ink-soft)}
.w:hover{transform:translateY(-2px);background:var(--teal-l)}
.w:nth-child(even){border-color:var(--orange)}
.dates{display:flex;flex-direction:column;gap:9px}
.dt{display:flex;align-items:center;gap:12px;background:var(--soft);border:1px solid var(--line);border-radius:14px;padding:8px 12px}
.dt .d{flex:0 0 auto;width:48px;text-align:center;border-radius:12px;overflow:hidden;border:1px solid var(--line-2);background:var(--card)}
.dt .d b{display:block;font:800 19px 'Montserrat';color:var(--slate);padding-top:2px}
.dt .d small{display:block;background:var(--orange);color:#fff;font:800 9.5px 'Montserrat';letter-spacing:.08em;text-transform:uppercase;padding:1px 0}
.dt:first-child{border-color:var(--teal);background:var(--teal-xl)}
.dt:first-child .d small{background:var(--teal)}
.dt p{margin:0;font-size:13.5px;font-weight:600}.dt p span{display:block;font-weight:500;color:var(--muted);font-size:12px}
.lbl{font:800 11px 'Montserrat';letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 4px 0}
.les{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-top:12px;overflow:hidden;animation:up .6s both}
.les>button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:13px;padding:14px 18px;cursor:pointer}
.les>button:hover{background:var(--soft)}
.les .n{flex:0 0 auto;width:40px;height:40px;border-radius:50%;background:var(--teal-l);color:var(--teal-d);font:800 16px 'Montserrat';display:flex;align-items:center;justify-content:center;transition:.3s}
.les.done .n{background:var(--ok);color:#fff}
.les.open .n{background:var(--orange);color:#fff}
.les h4{font-size:16px;color:var(--slate)}.les h4 small{display:block;font:500 12.5px 'Inter';color:var(--muted);margin-top:2px}
.les .pc{margin-left:auto;font:800 12px 'Montserrat';color:var(--muted);background:var(--soft);border:1px solid var(--line);border-radius:99px;padding:3px 11px}
.les.done .pc{color:var(--ok);background:var(--ok-l);border-color:var(--ok)}
.les .ch{font-size:13px;color:var(--muted);transition:.3s}.les.open .ch{transform:rotate(180deg)}
.body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s cubic-bezier(.3,.8,.3,1)}
.les.open .body{grid-template-rows:1fr}
.body>div{overflow:hidden}
.inner{padding:2px 18px 20px}
.task{border:1px solid var(--line);background:var(--soft);border-radius:18px;padding:16px;margin-top:12px}
.th{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.th .k{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--orange);color:#fff;font:800 13px 'Montserrat';display:flex;align-items:center;justify-content:center}
.th h5{font:800 15px 'Montserrat';margin:0;color:var(--slate)}.th p{margin:1px 0 0;font-size:12.5px;color:var(--ink-soft)}
.st{margin-left:auto;font:800 12px 'Montserrat';color:var(--muted);white-space:nowrap}.st.ok{color:var(--ok)}
.vid{aspect-ratio:16/9;border-radius:16px;background:linear-gradient(135deg,var(--teal),#4AA0A0 60%,var(--orange));display:flex;align-items:center;justify-content:center;color:#fff;text-align:center;font:800 15px 'Montserrat';position:relative;overflow:hidden}
.vid .pl{width:62px;height:62px;border-radius:50%;background:rgba(255,255,255,.25);border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-size:24px;margin:0 auto 8px}
.vid span{display:block;font:500 12px 'Inter';opacity:.9}
.bank{display:flex;flex-wrap:wrap;gap:8px;background:var(--card);border:1px dashed var(--line-2);border-radius:14px;padding:10px;margin-bottom:12px}
.bk{border:2px solid var(--teal);background:var(--card);color:var(--teal-d);border-radius:999px;padding:5px 13px;font:700 14px 'Inter';transition:.15s;box-shadow:var(--shadow-s)}
:root[data-theme=dark] .bk{color:#7FD0D0}
.bk:hover{background:var(--teal-l);transform:translateY(-1px)}.bk.used{opacity:.28;pointer-events:none}
.txt{font-size:16px;line-height:2.2}
.gp{display:inline-flex;align-items:center;justify-content:center;min-width:112px;border:2px dashed var(--orange);background:var(--orange-l);color:var(--orange-d);border-radius:12px;padding:1px 10px;font:700 14.5px 'Inter';margin:0 2px;cursor:pointer}
.gp small{font-weight:600;font-size:12px}
.gp.fl{background:var(--teal-l);border:2px solid var(--teal);color:var(--teal-d)}
:root[data-theme=dark] .gp.fl{color:#7FD0D0}
.gp.ok{background:var(--ok-l);border-color:var(--ok);color:var(--ok)}.gp.ok::after{content:'✅';margin-left:5px}
.gp.bad{background:var(--bad-l);border-color:var(--bad);color:var(--bad);animation:sh .35s}.gp.bad::after{content:'❌';margin-left:5px}
@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.mq .q{font:800 15px 'Montserrat';color:var(--slate);margin:4px 0 6px}.mq .q span{color:var(--orange-d)}
.op{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line-2);background:var(--card);border-radius:14px;padding:8px 12px;margin-top:7px;font-size:15px;transition:.15s}
.op:hover{border-color:var(--teal);transform:translateX(2px)}
.op i{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--teal-l);color:var(--teal-d);font:800 12px 'Montserrat';display:flex;align-items:center;justify-content:center;font-style:normal}
.op.sel{border-color:var(--teal);background:var(--teal-xl)}.op.sel i{background:var(--teal);color:#fff}
.op.ok{border-color:var(--ok);background:var(--ok-l)}.op.ok i{background:var(--ok);color:#fff}.op.ok::after{content:'✅';margin-left:auto}
.op.bad{border-color:var(--bad);background:var(--bad-l);animation:sh .35s}.op.bad i{background:var(--bad);color:#fff}.op.bad::after{content:'❌';margin-left:auto}
.act{display:flex;gap:10px;align-items:center;margin-top:14px;flex-wrap:wrap}
.btn{border:none;border-radius:14px;padding:10px 20px;font:800 14px 'Montserrat'}
.btn.o{background:linear-gradient(135deg,var(--orange),#F5B466);color:#fff;box-shadow:0 6px 16px rgba(240,160,80,.4)}
.btn.g{background:var(--card);border:1px solid var(--line-2);color:var(--slate)}
.res{font:800 14px 'Montserrat';color:var(--muted)}.res.ok{color:var(--ok)}
.new{font:800 10px 'Montserrat';letter-spacing:.08em;text-transform:uppercase;background:var(--orange);color:#fff;border-radius:99px;padding:2px 9px;margin-left:8px;vertical-align:middle;animation:pul 1.6s infinite}
@keyframes pul{50%{box-shadow:0 0 0 6px rgba(240,160,80,.22)}}
.les.cur{border-color:var(--orange)}
.les .when{font:600 12px 'Inter';color:var(--orange-d)}
.w sup{font:800 9.5px 'Montserrat';color:var(--orange-d);margin-left:4px}
.w.old{opacity:.78}
.more{border:2px dashed var(--line-2);background:none;border-radius:14px;padding:5px 14px;font:800 13px 'Montserrat';color:var(--muted)}
.more:hover{border-color:var(--teal);color:var(--teal-d)}
.ring div small.cur{color:var(--orange-d);text-align:center;max-width:90px;line-height:1.2;margin-top:2px}
.empty{text-align:center;color:var(--muted);padding:22px 10px;font-size:14px;border:2px dashed var(--line-2);border-radius:18px;margin-top:12px}
.note{font-size:13.5px;color:var(--ink-soft);background:var(--card);border:1px dashed var(--line-2);border-radius:12px;padding:9px 13px;margin-top:10px}
.ft{text-align:center;color:var(--muted);font-size:12px;margin:34px 0 40px}
@media(max-width:640px){.two{grid-template-columns:1fr}.hello{grid-template-columns:1fr}.ringw{margin:0 auto;order:-1}.card{padding:16px 16px}.hdr-in{padding:12px 14px}.hdr img{height:42px}.gp{min-width:96px}}

.yt{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#000}.yt iframe{position:absolute;inset:0;width:100%;height:100%;border:0}.note a{color:var(--teal-d);font-weight:700}.vw em{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vw{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--teal);border-radius:12px;padding:7px 11px}
.vw:nth-child(even){border-left-color:var(--orange)}
.vw b{display:block;font:800 14.5px 'Montserrat';color:var(--teal-d)}:root[data-theme=dark] .vw b{color:#7FD0D0}
.vw span{font-size:13px;color:var(--ink-soft)}
.rt{width:100%;border-collapse:separate;border-spacing:0;font-size:13px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card)}
.rt th,.rt td{padding:7px 9px;text-align:left;border-bottom:1px solid var(--line);border-left:1px solid var(--line);vertical-align:top}
.rt tr:last-child td,.rt tr:last-child th{border-bottom:none}.rt th:first-child,.rt td:first-child{border-left:none}
.rt thead th{background:var(--teal-l);color:var(--teal-d);font:800 12px 'Montserrat'}
.rt tbody th{background:var(--orange);color:#fff;font:800 16px 'Montserrat';text-align:center;width:40px}
.rt small{color:var(--ink-soft);font-style:italic;font-size:12.5px}
.acc{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.acc button{width:38px;height:34px;border-radius:10px;border:1px solid var(--line-2);background:var(--card);font:700 16px 'Inter';color:var(--slate)}.acc button:hover{background:var(--teal-l);border-color:var(--teal)}
.fi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:9px 12px;margin-bottom:9px;font-size:15.5px;line-height:2.3}
.fn{font:800 13px 'Montserrat';color:var(--orange-d);margin-right:7px}.fn2{font:800 13px 'Montserrat';color:var(--orange-d);margin-bottom:4px}
.fw{display:inline-block;vertical-align:middle;margin:0 3px}.fw input{width:200px;border:2px solid var(--line-2);background:var(--soft);border-radius:11px;padding:4px 9px;font:600 15px 'Inter';color:var(--ink);outline:none}
.fw input::placeholder{font-size:12px;font-weight:500;color:var(--muted)}
.fw input:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(58,140,140,.15)}
.fw.wide{display:block;margin:6px 0 0}.fw.wide input{width:100%}
.fw input.ok{border-color:var(--ok);background:var(--ok-l)}.fw input.bad{border-color:var(--bad);background:var(--bad-l);animation:sh .35s}
.fw.ok::after{content:'✅';margin-left:3px}.fw.bad::after{content:'❌';margin-left:3px}.fw.wide::after{content:none}
.bq{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.slot{min-height:46px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;border:2px dashed var(--orange);background:var(--orange-l);border-radius:12px;padding:6px 8px;margin-bottom:8px}
.slot small{color:var(--orange-d)}.slot.ok{border:2px solid var(--ok);background:var(--ok-l)}.slot.bad{border:2px solid var(--bad);background:var(--bad-l);animation:sh .35s}
.bk.fl{background:var(--teal-l)}
.bq .bank{margin:0;padding:8px;background:var(--soft)}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px 14px}.mcol{display:flex;flex-direction:column;gap:9px}
.mi{position:relative;text-align:left;border:2px solid var(--line-2);background:var(--card);border-radius:14px;padding:10px 12px;font-size:14.5px;font-weight:600;transition:.18s;min-height:48px;line-height:1.35}
.mi:hover{border-color:var(--teal)}.mi.sel{border-color:var(--orange);background:var(--orange-l);box-shadow:0 0 0 4px rgba(240,160,80,.22)}
.mi.wrong{border-color:var(--bad);background:var(--bad-l);animation:sh .35s}
.mi.done{pointer-events:none;border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,var(--card))}
.mi.done::before{content:attr(data-n);position:absolute;right:-9px;top:-9px;width:22px;height:22px;border-radius:50%;background:var(--c);color:#fff;font:800 12px 'Montserrat';display:flex;align-items:center;justify-content:center}
.ti{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:9px}.tu{font-weight:600;font-size:15px}
@media(max-width:640px){.rt th:nth-child(4),.rt td:nth-child(4){display:none}.mt{gap:8px}.mi{font-size:13.5px;padding:9px}.fw input{width:150px}}
.part{display:flex;flex-direction:column;gap:2px;margin:22px 2px 0;padding:10px 14px;border-radius:14px;background:linear-gradient(90deg,var(--teal-l),transparent);border-left:5px solid var(--orange)}
.part b{font:800 15px 'Montserrat';color:var(--slate)}.part span{font-size:12.5px;color:var(--ink-soft)}
.vw em{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.vg{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}

.cp{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.cph{display:flex;align-items:center;gap:8px;margin-bottom:6px}.cph .fn{margin:0}
.ty{font:800 10.5px 'Montserrat';letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 10px;color:#fff}
.ty.t1{background:var(--teal)}.ty.t2{background:var(--orange)}.ty.t3{background:var(--slate)}
:root[data-theme=dark] .ty.t3{background:#5E7391}
.cw{display:flex;flex-wrap:wrap;gap:6px}.cwd{border:2px solid var(--line-2);background:var(--soft);border-radius:999px;padding:3px 12px;font:700 14px 'Inter';color:var(--teal-d)}
:root[data-theme=dark] .cwd{color:#7FD0D0}.cwd:nth-child(3n+2){border-color:var(--teal)}.cwd:nth-child(3n){border-color:var(--orange)}
#repwrap{position:fixed;left:-10000px;top:0;width:760px;background:#fff;color:#24324A}
.rd{font-family:'Inter',Arial,sans-serif;font-size:12.5px;line-height:1.45;color:#24324A;background:#fff;padding:6px}
.rd *{box-sizing:border-box}
.rhd{display:flex;align-items:center;gap:16px;border-bottom:3px solid #F0A050;padding-bottom:12px;margin-bottom:14px}.rhd img{height:58px}
.rt1{font:800 12px 'Montserrat',Arial;letter-spacing:.14em;text-transform:uppercase;color:#DB8736}.rt2{font:800 24px 'Montserrat',Arial;color:#475771}.rt3{color:#5E6C82;font-size:12px}
.rsum{display:flex;gap:12px;margin-bottom:14px}.rsum div{flex:1;background:#F1F8F8;border-left:5px solid #3A8C8C;border-radius:10px;padding:8px 12px}.rsum div:nth-child(2){border-left-color:#F0A050;background:#FDF0E0}

 rasgos de personalidad, los científicos pueden concluir que existe un fuerte componente <span class=\"hl\" data-g=\"генетичний\">genético</span>. Uno de los casos más célebres es el de los gemelos Jim: separados al nacer y reunidos décadas después, compartían la misma profesión, el mismo nombre para sus hijos e incluso el mismo peinado.</p><p>Sin embargo, el entorno también juega un papel crucial. Un <span class=\"hl\" data-g=\"фактор середовища\">factor ambiental</span> tan simple como la alimentación puede influir en el desarrollo de ciertas enfermedades, incluso en personas con la misma información genética. Esto demuestra que los genes no son un destino, sino un punto de partida.</p><p>Uno de los conceptos más debatidos en este campo es la <span class=\"hl\" data-g=\"успадковуваність\">heredabilidad</span> de la inteligencia. Aunque algunos estudios sugieren que tiene una base genética significativa, muchos científicos advierten que se trata de un concepto estadístico complejo, y que afirmar que la inteligencia «se hereda» va en contra de décadas de psicología conductista, que considera que el cerebro humano es, al nacer, una página en blanco.</p><p>Lo que sí está claro es que gemelos e investigadores seguirán, juntos, ayudándonos a entender uno de los misterios más profundos de la biología humana.</p>"}, {"t": "vocab", "title": "Vocabulario", "ua": "Слова з тексту: прочитай уголос із прикладом і познач, коли вивчила. ⭐ — на головну", "items": [["la herencia", "спадковість", "La herencia biológica determina el color de los ojos."], ["el gemelo monocigótico", "однояйцевий близнюк", "Los gemelos monocigóticos comparten el 100% de su ADN."], ["el gemelo fraterno / el mellizo", "різнояйцевий близнюк, двійня", "Mis mellizos no se parecen mucho."], ["el ADN", "ДНК", "El ADN contiene la información genética."], ["el gen", "ген", "Un solo gen puede influir en varios rasgos."], ["el material genético", "генетичний матеріал", "Los hermanos comparten parte del material ge const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function reportModel(){
  const l=CFG.lessons[CFG.current],d=new Date();
  const ds=d.toLocaleDateString('uk-UA',{day:'2-digit',month:'2-digit',year:'numeric'})+' '+d.toLocaleTimeString('uk-UA',{hour:'2-digit',minute:'2-digit'});
  const M={student:CFG.student,lesson:l.title,date:ds,rows:[],errs:[],n:0,dn:0,tot:0,sc:0};let idx=0;
  l.tasks.forEach((t,ti)=>{
    if(t.t==='part'){M.rows.push({part:t.label+' · '+t.title});return}
    if(!cnt(t))return;idx++;M.n++;const k=CFG.current+'_'+ti,r=S.rep[k],done=!!S.done[k];if(done)M.dn++;
    let res='—',st='no';
    if(r){res=r.ok+' / '+r.n;M.tot+=r.n;M.sc+=r.ok;st=done?'yes':'wip'}else if(done){res='✓';st='yes'}
    M.rows.push({idx,title:t.title,res,st});
    if(r&&r.errs&&r.errs.length)M.errs.push({h:idx+'. '+t.title,items:r.errs});
  });
  M.pct=M.tot?Math.round(M.sc/M.tot*100):0;return M;
}
const STX={yes:'виконано',wip:'у процесі',no:'не виконано'};
function reportHtml(){
  const M=reportModel();
  const rows=M.rows.map(r=>r.part?'<tr class="rp"><td colspan="4">'+esc(r.part)+'</td></tr>':'<tr><td>'+r.idx+'</td><td>'+esc(r.title)+'</td><td class="c">'+esc(r.res)+'</td><td><span class="'+r.st+'">'+STX[r.st]+'</span></td></tr>').join('');
  const errs=M.errs.map(g=>'<div class="rh">'+esc(g.h)+' <small>('+g.items.length+')</small></div>'+g.items.map(e=>'<div class="ri"><div class="rq">'+esc(e.q)+'</div><div class="ry">✗ '+esc(e.you)+'</div><div class="rr">✓ '+esc(e.right)+'</div></div>').join('')).join('');
  return '<div class="rd"><div class="rhd"><img src="'+LOGO.fullS+'" alt="AMO"><div><div class="rt1">Práctica individual</div><div class="rt2">'+esc(M.student)+'</div><div class="rt3">'+esc(M.lesson)+' · '+M.date+'</div></div></div>'
   +'<div class="rsum"><div><b>'+M.dn+' / '+M.n+'</b><span>завдань виконано</span></div><div><b>'+(M.tot?M.pct+'%':'—')+'</b><span>правильних відповідей ('+M.sc+' / '+M.tot+')</span></div></div>'
   +'<h3>Результати</h3><table class="rtb"><thead><tr><th>#</th><th>Завдання</th><th>Результат</th><th>Статус</th></tr></thead><tbody>'+rows+'</tbody></table>'

}
